const $=id=>document.getElementById(id);let S=null;
const fresh=()=>({v:2,step:0,tab:0,lg:0,ut:0,st:0,name:"",club:"",mf:"",bal:100,own:[],form:50,tac:[4,4,2],xi:[],bn:[],fx:[],r:0,rs:{},stt:{},tr:0,se:"",custom:0});
const load=()=>{let s=null;try{s=JSON.parse(localStorage.getItem("mb"))}catch(e){}return s&&s.v==2?s:fresh()};S=load();

function ex(){const d=document.createElement("div");d.id="dlg";d.style.cssText="position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px";d.innerHTML=`<div class="card" style="max-width:360px;width:100%"><h3>Ukončiť hru</h3><div class="m">Chceš uložiť postup? Pri uložení sa hra nabudúce otvorí v poslednom uloženom kroku.</div><br><div class="g"><button class="p" onclick="xs(1)">Uložiť</button><button onclick="xs(0)">Neuložiť</button></div><br><button style="width:100%" onclick="$('dlg').remove()">Zrušiť</button></div>`;document.body.appendChild(d)}
function xs(k){$("dlg").remove();let m="Postup bol uložený.";if(k){if(!commit())m="Uloženie sa nepodarilo (úložisko prehliadača je nedostupné)."}else m="Postup nebol uložený, zmeny od posledného uloženia sa zahodili.";$("app").innerHTML=`<div class="card"><h2>Hra ukončená</h2><div class="m">${m}</div><br><button class="p" onclick="S=load();R()">Otvoriť hru</button></div>`;window.scrollTo(0,0)}
const pr=v=>Math.round((5+5*(Math.min(Math.max(v,10),180)-10)/170)*10)/10;
const nm=i=>i==S.ut?S.club:LG[S.lg].t[i].n;
function rr(n){const a=[...Array(n).keys()],R=[];for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){let h=a[i],w=a[n-1-i];if(i==0&&r%2)[h,w]=[w,h];m.push([h,w])}R.push(m);a.splice(1,0,a.pop())}return R.concat(R.map(m=>m.map(([h,w])=>[w,h])))}
function chk(){const c={G:0,D:0,M:0,A:0};S.xi.forEach(i=>c[PL[i].p]++);return S.xi.length==11&&S.bn.length==4&&c.G==1&&c.D==S.tac[0]&&c.M==S.tac[1]&&c.A==S.tac[2]}
function auto(){const o=S.own.map(i=>PL[i]).sort((a,b)=>b.o-a.o),u=new Set(),x=[];[["G",1],["D",S.tac[0]],["M",S.tac[1]],["A",S.tac[2]]].forEach(([p,n])=>o.filter(q=>q.p==p).slice(0,n).forEach(q=>{x.push(q.id);u.add(q.id)}));S.xi=x;S.bn=o.filter(q=>!u.has(q.id)).slice(0,4).map(q=>q.id)}
function tg(id){const a=S.xi.indexOf(id),b=S.bn.indexOf(id);if(a>=0){S.xi.splice(a,1);if(S.bn.length<4)S.bn.push(id)}else if(b>=0)S.bn.splice(b,1);else if(S.xi.length<11)S.xi.push(id);else if(S.bn.length<4)S.bn.push(id);save();R()}
function pois(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function str(i){if(i==S.ut)return S.xi.reduce((a,j)=>a+PL[j].o,0)/11+(S.form-50)/10;const o=TP[S.lg][i].filter(p=>!S.own.includes(p.id)).map(p=>p.o).sort((a,b)=>b-a).slice(0,11);return o.reduce((a,b)=>a+b,0)/11}
function sim(h,a){const d=str(h)-str(a);return[pois(1.4*Math.exp((d+3)/22)),pois(1.1*Math.exp(-d/22))]}
function stat(g){S.xi.forEach(i=>{(S.stt[i]=S.stt[i]||{a:0,g:0,s:0}).a++});const pk=(w,ex)=>{const W=S.xi.map((j,k)=>k==ex?0:w[PL[j].p]),t=W.reduce((a,b)=>a+b,0);let x=Math.random()*t,j=0;while(j<W.length-1&&(x-=W[j])>=0)j++;return j};for(let k=0;k<g;k++){const j=pk({G:0,D:1,M:2,A:5},-1);S.stt[S.xi[j]].g++;if(Math.random()<.7){const q=S.stt[S.xi[pk({G:0,D:1,M:3,A:2},j)]];q.s=(q.s||0)+1}}}

function fin(){S.tac=[4,4,2];auto();ns();S.step=4;S.tab=0;S.mf="";save();R()}
function tbl(){const t=LG[S.lg].t.map((_,i)=>({i,p:0,w:0,d:0,l:0,gf:0,ga:0,pt:0}));for(const k in S.rs){const[r,i]=k.split("-"),[h,a]=S.fx[r][i],[x,y]=S.rs[k],H=t[h],A=t[a];H.p++;A.p++;H.gf+=x;H.ga+=y;A.gf+=y;A.ga+=x;if(x>y){H.w++;H.pt+=3;A.l++}else if(x<y){A.w++;A.pt+=3;H.l++}else{H.d++;A.d++;H.pt++;A.pt++}}return t.sort((a,b)=>b.pt-a.pt||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}
function ns(){if(!S.se)S.se="2026/27";else{const y=+S.se.slice(0,4)+1;S.se=y+"/"+String((y+1)%100).padStart(2,"0")}S.fx=rr(LG[S.lg].t.length);S.r=0;S.rs={};S.stt={};S.tr=0;S.form=50}
function go(){S.custom=0;S.own=TP[S.lg][S.ut].map(p=>p.id);S.bal=100;S.tac=[4,4,2];auto();ns();S.step=4;S.tab=0;save();R()}
function sv(k){return`<img src="${IM[k]}" alt="${ST[k][0]}" style="width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;display:block">`}
function setup(){const s=S.step;if(s==0)return`<div class="card"><h2>❄️ Mráz Bros – nový profil</h2><p class="m">Trénerský manažér pre hráčov 10+</p><input id="nn" placeholder="Meno trénera" value="${S.name}" style="width:100%"><br><br><button class="p" onclick="S.name=$('nn').value.trim();if(!S.name){alert('Zadaj meno.');return}S.step=1;R()">Ďalej</button></div>`;
if(s==1)return`<h2>Vyber ligu</h2>`+LG.map((l,i)=>`<div class="card r" onclick="S.lg=${i};S.step=2;R()" style="cursor:pointer"><h3>${l.n}</h3><span>›</span></div>`).join("");
if(s==2)return`<h2>Vyber štadión</h2><p class="m">Pohľad z vtáčej perspektívy</p>`+ST.map((t,i)=>`<div class="card ${S.st==i?'hl':''}" onclick="S.st=${i};S.step=3;R()" style="cursor:pointer">${sv(i)}<div class="r"><b>${i+1}. ${t[0]}</b><span class="m">${t[1].toLocaleString("sk")} miest</span></div></div>`).join("");
if(s==5)return dfv();return`<h2>${LG[S.lg].n} – vyber tím</h2>`+LG[S.lg].t.map((t,i)=>`<div class="card r ${S.ut==i?'hl':''}" onclick="S.ut=${i};R()" style="cursor:pointer"><h3>${t.n}</h3><span class="m">${t.p.length?t.p.length+" reálnych hráčov":"fiktívni hráči"}</span></div>`).join("")+`<div class="card"><div class="m">Vlastný názov tímu (voliteľné)</div><input id="cn" placeholder="${LG[S.lg].t[S.ut].n}" style="width:100%"><br><br><button class="p" onclick="S.club=$('cn').value.trim()||LG[S.lg].t[S.ut].n;go()">Začať sezónu</button></div><div class="card"><h3>Vlastný tím</h3><div class="m">Vlastný tím nahradí v lige vybraný tím (počet tímov ostane ${LG[S.lg].t.length}). Hráčov si vyberieš z rozpočtu 100 mil.</div><br><input id="vn" placeholder="Názov vlastného tímu" style="width:100%"><br><br><select id="vr" style="width:100%">${LG[S.lg].t.map((t,i)=>`<option value="${i}">Nahradiť: ${t.n}</option>`).join("")}</select><br><br><button class="p" onclick="cust()">Vybrať hráčov</button></div>`}
function fxv(){if(S.r>=S.fx.length){const p=tbl().findIndex(x=>x.i==S.ut)+1;return`<div class="card"><h2>🏁 Sezóna ${S.se} skončila</h2><p>Tvoj tím skončil na ${p}. mieste.</p><button class="p" onclick="ns();save();R()">Nová sezóna</button></div>`}
const m=S.fx[S.r],me=m.findIndex(([h,a])=>h==S.ut||a==S.ut),[h,a]=m[me];
return`<div class="card hl"><div class="m">Sezóna ${S.se} · Kolo ${S.r+1}/${S.fx.length}</div><h2>${nm(h)} vs ${nm(a)}</h2><div class="m">${h==S.ut?"Doma":"Vonku"} · Forma tímu: ${S.form}/100</div></div>
<div class="card"><h3>Voľný deň pred zápasom</h3>${S.tr?'<p class="m">Dnes už si trénoval.</p>':'<div class="g">'+TR.map((t,i)=>`<button onclick="trn(${i})">${t[0]}</button>`).join("")+"</div>"}</div>
<div class="card"><h3>Zápas</h3><button class="p" onclick="play(0)">⚡ Simulovať zápas</button><p class="m">alebo zadaj výsledok (${nm(h)} : ${nm(a)})</p><div class="r"><input id="gh" type="number" min="0" style="width:30%"><b>:</b><input id="ga" type="number" min="0" style="width:30%"><button onclick="play(1)">Uložiť</button></div></div>
<div class="card"><h3>Program</h3>`+S.fx.map((R,r)=>{const[x,y]=R.find(([p,q])=>p==S.ut||q==S.ut),k=r+"-"+R.findIndex(([p,q])=>p==S.ut||q==S.ut),z=S.rs[k];return`<div class="r m" style="padding:3px 0"><span>${r+1}. ${nm(x)} – ${nm(y)}</span><b>${z?z[0]+":"+z[1]:"–"}</b></div>`}).join("")+"</div>"}
function resv(){let o="";for(let r=S.r-1;r>=0;r--)o+=`<div class="card"><div class="m">Kolo ${r+1}</div>`+S.fx[r].map(([h,a],i)=>`<div class="r" style="${h==S.ut||a==S.ut?'color:var(--a)':''}"><span>${nm(h)}</span><b>${S.rs[r+"-"+i].join(":")}</b><span>${nm(a)}</span></div>`).join("")+"</div>";return o||'<div class="card">Zatiaľ žiadne odohraté zápasy.</div>'}
function tblv(){return`<div class="card"><table class="tbl"><tr class="m"><th>#</th><th>Tím</th><th>Z</th><th>V</th><th>R</th><th>P</th><th>Skóre</th><th>B</th></tr>`+tbl().map((t,k)=>`<tr style="${t.i==S.ut?'color:var(--a);font-weight:700':''}"><td>${k+1}</td><td>${nm(t.i)}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}:${t.ga}</td><td><b>${t.pt}</b></td></tr>`).join("")+"</table></div>"}
function stv(){const o=S.own.map(i=>PL[i]).sort((a,b)=>"GDMA".indexOf(a.p)-"GDMA".indexOf(b.p)||b.o-a.o);return`<div class="card"><div class="m">Klepnutím meníš: základ (Z) → striedačka (S) → mimo. Základ ${S.xi.length}/11, striedačka ${S.bn.length}/4</div><button onclick="auto();save();R()">Auto zostava</button></div><div class="card"><table class="tbl"><tr class="m"><th></th><th>Hráč</th><th>Post</th><th>OVR</th><th>Zápasy</th><th>Góly</th><th>Asist.</th><th>Predaj</th></tr>`+o.map(p=>{const s=S.stt[p.id]||{a:0,g:0,s:0},z=S.xi.includes(p.id)?"Z":S.bn.includes(p.id)?"S":"–";return`<tr><td><button onclick="tg(${p.id})" style="padding:3px 9px">${z}</button></td><td style="white-space:nowrap">${face(p.id,26)} ${p.n}</td><td>${p.p}</td><td>${p.o}</td><td>${s.a}</td><td>${s.g}</td><td><button style="padding:3px 9px" onclick="if(confirm('Predať hráča za ${pr(p.v)} mil.?'))sell(${p.id})">${pr(p.v)}</button></td></tr>`}).join("")+"</table></div>"}
function mrow(p,o){return`<div class="r" style="padding:5px 0"><span style="display:flex;gap:8px;align-items:center">${face(p.id,30)}<span>${p.n} <span class="m">${p.p} · ${p.t} · OVR ${p.o}</span></span></span>${o?`<button onclick="sell(${p.id})">Predať</button>`:`<button ${S.bal<pr(p.v)||(S.step==5&&S.own.length>=25)?"disabled":""} onclick="buy(${p.id})">${pr(p.v)}</button>`}</div>`}
function mkt(){const ml=S.ml===undefined?S.lg:S.ml,l=ALL.filter(p=>!S.own.includes(p.id)&&(ml===""||p.lg==ml)&&(!S.mf||p.p==S.mf)),big=l.length>150;l.sort((a,b)=>big?b.v-a.v:"GDMA".indexOf(a.p)-"GDMA".indexOf(b.p)||b.v-a.v);const sh=l.slice(0,150);return`<div class="card"><h3>Trh hráčov (${l.length})</h3><div class="g"><select onchange="S.ml=this.value;R()"><option value="" ${ml===""?"selected":""}>Všetky ligy</option>${LG.map((x,i)=>`<option value="${i}" ${String(ml)==i?"selected":""}>${x.n}</option>`).join("")}</select><select onchange="S.mf=this.value;R()">${[["","Všetky posty"],["G","Brankári"],["D","Obrancovia"],["M","Záložníci"],["A","Útočníci"]].map(([v,t])=>`<option value="${v}" ${S.mf==v?"selected":""}>${t}</option>`).join("")}</select></div><div class="m">Ceny 5–10 mil. podľa trhovej hodnoty (transfermarkt)${l.length>sh.length?" · zobrazených "+sh.length+" z "+l.length+", zúž výber filtrom":""}</div>`+sh.map(p=>mrow(p,0)).join("")+"</div>"}
function budv(){return`<div class="card hl"><div class="m">Rozpočet</div><h2>⚽ ${S.bal.toFixed(1)} mil. futbaliek</h2><div class="m">Víťazstvo +3, remíza +1 mil. futbaliek</div></div>`+mkt()}
function dfv(){const c={G:0,D:0,M:0,A:0};S.own.forEach(i=>c[PL[i].p]++);const ok=Object.keys(MIN).every(k=>c[k]>=MIN[k])&&S.own.length<=25,o=S.own.map(i=>PL[i]).sort((a,b)=>"GDMA".indexOf(a.p)-"GDMA".indexOf(b.p)||b.o-a.o);return`<h2>${S.club} – výber hráčov</h2><div class="card hl"><div class="m">Rozpočet</div><h2>⚽ ${S.bal.toFixed(1)} mil. futbaliek</h2><div class="m">Hráčov ${S.own.length}/25 · min. brankári ${c.G}/2, obrancovia ${c.D}/5, záložníci ${c.M}/5, útočníci ${c.A}/3</div><br><button class="p" ${ok?"":"disabled"} onclick="fin()">Začať sezónu</button></div><div class="card"><h3>Môj tím</h3>`+(o.map(p=>mrow(p,1)).join("")||'<div class="m">Zatiaľ nikto.</div>')+"</div>"+mkt()}
function stdv(){const t=ST[S.st];return`<div class="card">${sv(S.st)}<h2>${t[0]}</h2><div class="m">Kapacita ${t[1].toLocaleString("sk")} miest</div></div><div class="card"><h3>Zmeniť štadión</h3>`+ST.map((x,i)=>`<div class="r" style="padding:5px 0"><span>${x[0]} <span class="m">${x[1].toLocaleString("sk")}</span></span><button ${i==S.st?"disabled":""} onclick="S.st=${i};save();R()">${i==S.st?"Vybraný":"Vybrať"}</button></div>`).join("")+"</div>"}
function tacv(){const g=p=>S.xi.map(i=>PL[i]).filter(q=>q.p==p),row=p=>`<div class="row">${g(p).map(q=>`<div class="pl">${face(q.id,26)}<br><b>${q.o}</b><br>${q.n.split(" ").pop()}</div>`).join("")}</div>`;return`<div class="card"><h3>Herná taktika</h3><div class="g" style="grid-template-columns:repeat(4,1fr)">`+FM.map(f=>`<button class="${f+""==S.tac+""?"p":""}" onclick="S.tac=[${f}];auto();save();R()">${f.join("-")}</button>`).join("")+`</div></div><div class="pitch">${row("A")}${row("M")}${row("D")}${row("G")}</div><div class="card"><div class="m">Striedačka</div>${S.bn.map(i=>PL[i].n+" ("+PL[i].p+")").join(", ")}</div>`}
const TABS=[["📅 Zápasy",fxv],["📋 Výsledky",resv],["🏆 Tabuľka",tblv],["📊 Hráči",stv],["💰 Rozpočet",budv],["🏟️ Štadión",stdv],["🧠 Taktika",tacv]];
function R(){const a=$("app");if(S.step!=4){a.innerHTML=`<div style="text-align:right"><button onclick="ex()" style="padding:4px 10px;font-size:12px">Ukončiť</button></div>`+setup();return}a.innerHTML=`<div class="hd"><b>${LG[S.lg].n}</b><span>${S.club}</span><i>⚽ ${S.bal.toFixed(1)}</i><button onclick="ex()" style="padding:4px 10px;font-size:12px">Ukončiť</button></div>${TABS[S.tab][1]()}<nav>${TABS.map((t,i)=>`<button class="${i==S.tab?"on":""}" onclick="S.tab=${i};R()">${t[0]}</button>`).join("")}</nav>`;window.scrollTo(0,0)}
R();
</script></body></html>
